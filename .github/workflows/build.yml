name: Build Mod

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: c_demo_mod.dll
            platform: windows
          - os: macos-latest
            artifact: c_demo_mod.dylib
            platform: macos
          - os: ubuntu-latest
            artifact: c_demo_mod.so
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            unzip

      - name: Fetch client import library (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          # Windows mods must link the client's import library; a DLL with
          # unresolved client symbols crashes the game on the first API call.
          curl -fsSL -o mod-sdk.zip \
            "https://github.com/eddoww/astonia_community_client/releases/download/v1.2.39/mod-sdk.zip"
          unzip -oq mod-sdk.zip
          mkdir -p lib
          cp mod-sdk/lib/moac.a mod-sdk/lib/moac.lib lib/

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cp build/c_demo_mod.dll c_demo_mod.dll

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          cmake --build build
          cp build/c_demo_mod.dylib c_demo_mod.dylib

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cp build/c_demo_mod.so c_demo_mod.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release files
        run: |
          mkdir -p release
          cp artifacts/windows/c_demo_mod.dll release/
          cp artifacts/macos/c_demo_mod.dylib release/
          cp artifacts/linux/c_demo_mod.so release/
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/c_demo_mod.dll
            release/c_demo_mod.dylib
            release/c_demo_mod.so
          generate_release_notes: true
